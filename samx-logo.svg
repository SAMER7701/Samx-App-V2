  <line x1="155" y1="295" x2="195" y2="295" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round"/>

  <!-- نص SAMX -->
  <text x="200" y="378" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="4">SAMX</text>
